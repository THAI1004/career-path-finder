services:
  - type: web
    name: educareer-guidance
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/catalog
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /tmp/educareer-platform.json
